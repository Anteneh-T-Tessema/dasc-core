[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dasc-langgraph"
version = "0.1.0"
description = "LangGraph orchestration adapter for DASC safety middleware"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dasc-core>=0.1.1",
    "langgraph>=0.0.10"
]

[tool.setuptools]
packages = ["dasc_langgraph"]
