[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dasc-core"
version = "0.1.0"
authors = [
  { name="Anteneh T. Tessema", email="anteneh@example.com" },
]
description = "A deterministic safety controller for agentic workflows."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0"
]

[project.urls]
"Homepage" = "https://github.com/Anteneh-T-Tessema/dasc-core"
"Bug Tracker" = "https://github.com/Anteneh-T-Tessema/dasc-core/issues"

[project.scripts]
dasc = "dasc.cli:main"
