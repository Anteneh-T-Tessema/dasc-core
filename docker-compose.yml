version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dasc_db
      POSTGRES_USER: dasc_user
      POSTGRES_PASSWORD: dasc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://dasc_user:dasc_password@db:5432/dasc_db
    ports:
      - "8000:8000"
    depends_on:
      - db

  dashboard:
    build: ./dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
