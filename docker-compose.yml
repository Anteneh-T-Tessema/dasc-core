services:
  dasc-server:
    build:
      context: ./dasc-node
    ports:
      - "3000:3000"
    volumes:
      - ./dasc-node/dasc_ledger_node.db:/app/dasc_ledger_node.db
    environment:
      - NODE_ENV=production
    restart: always

  dasc-dashboard:
    build:
      context: ./dashboard
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - dasc-server
    restart: always
