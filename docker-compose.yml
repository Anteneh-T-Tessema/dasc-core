version: '3.8'

services:
  dasc-db:
    image: postgres:15-alpine
    container_name: dasc-db
    environment:
      POSTGRES_USER: dasc_admin
      POSTGRES_PASSWORD: dasc_secure_pwd_123
      POSTGRES_DB: dasc_ledger
    volumes:
      - dasc_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  dasc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dasc-server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dasc_admin:dasc_secure_pwd_123@dasc-db:5432/dasc_ledger
      - DASC_MASTER_KEY=dasc-dev-key-123
    depends_on:
      - dasc-db
    restart: always

volumes:
  dasc_db_data:
