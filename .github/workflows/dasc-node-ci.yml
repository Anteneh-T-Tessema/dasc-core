name: DASC-Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dasc-node/package-lock.json

    - name: Install dependencies
      run: cd dasc-node && npm install --legacy-peer-deps

    - name: Run Tests
      run: cd dasc-node && npm test

    - name: Build Check
      run: cd dasc-node && npx tsc --noEmit
